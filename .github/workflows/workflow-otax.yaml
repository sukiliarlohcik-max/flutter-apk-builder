name: OTAX Flutter APK Builder

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'Optional public ZIP URL. Leave empty to use source.zip uploaded by OTAX.'
        required: false
        type: string
      tag:
        description: 'Optional build tag/name.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Flutter source
        shell: bash
        env:
          ZIP_URL: ${{ github.event.inputs.zip_url }}
          BUILD_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          rm -rf /tmp/zip_raw /tmp/flutter_src /tmp/source.zip
          mkdir -p /tmp/zip_raw
          if [ -n "${ZIP_URL:-}" ]; then
            echo "Downloading ZIP from supplied URL..."
            curl -fL --retry 3 --connect-timeout 15 "$ZIP_URL" -o /tmp/source.zip
          else
            test -f source.zip || { echo "source.zip tidak ditemukan di repository"; exit 1; }
            cp source.zip /tmp/source.zip
          fi
          unzip -q /tmp/source.zip -d /tmp/zip_raw
          roots=(/tmp/zip_raw/*)
          if [ "${#roots[@]}" -eq 1 ] && [ -d "${roots[0]}" ]; then
            mv "${roots[0]}" /tmp/flutter_src
          else
            mkdir -p /tmp/flutter_src
            cp -a /tmp/zip_raw/. /tmp/flutter_src/
          fi
          if [ ! -f /tmp/flutter_src/pubspec.yaml ]; then
            echo "pubspec.yaml tidak ditemukan di root project Flutter"
            find /tmp/zip_raw -maxdepth 4 -name pubspec.yaml -print
            exit 1
          fi
          echo "Build tag: ${BUILD_TAG:-default}"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.41.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Normalize known incompatible dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/flutter_src/pubspec.yaml')
          lines=p.read_text().splitlines()
          lines=[x for x in lines if not x.startswith('  flutter_native_splash:')]
          p.write_text('\n'.join(lines)+'\n')
          PY

      - name: Flutter pub get
        working-directory: /tmp/flutter_src
        run: flutter pub get

      - name: Flutter analyze
        working-directory: /tmp/flutter_src
        run: flutter analyze --no-fatal-infos || true

      - name: Build APK release
        working-directory: /tmp/flutter_src
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OTAX-apk
          path: /tmp/flutter_src/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
